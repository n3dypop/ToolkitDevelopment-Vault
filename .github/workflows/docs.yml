name: docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check vault
        run: python scripts/check-vault.py
      - name: Test synchronization and validation
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check PowerShell entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-vault.ps1
